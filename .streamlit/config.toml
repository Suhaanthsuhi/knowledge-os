# Headless keeps `streamlit run` from blocking on the first-run email prompt.
# Set headless = false if you would rather it opened a browser tab for you.
[server]
headless = true
port = 8501
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7FB"
textColor = "#0F172A"
font = "sans serif"
